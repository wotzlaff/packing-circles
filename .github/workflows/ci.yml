name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust-and-bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Select stable Rust and components
        run: |
          rustup default stable
          rustup component add rustfmt clippy
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Check lints
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test Rust
        run: cargo test --workspace --locked
      - name: Test independent benchmark checker
        run: python3 -m unittest discover -s bench -v
      - name: Verify frozen synthetic inputs
        run: python3 bench/generate_instances.py --check
      - name: Build numerical regression probe
        run: cargo build -p packing-core --release --example numerical_probe --locked
      - name: Replay archived C++ numerical reference
        run: python3 bench/check_numerical_parity.py --replay-report bench/results/numerical-parity.json
      - name: Build trace-capable CLI
        run: cargo build -p packing-cli --release --locked
      - name: Validate a real trace through the unified runner
        run: |
          python3 bench/compare.py run --config bench/configs/a-smoke.json --output "$RUNNER_TEMP/circles-trace-smoke.jsonl"
          python3 - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'bench')
          from replay_trace import replay_trace, validate_run_summary
          raw=Path(os.environ['RUNNER_TEMP'])/'circles-trace-smoke.jsonl'
          rows=[json.loads(line) for line in raw.read_text().splitlines()]
          assert len(rows)==1 and rows[0]['successful']
          row=rows[0]
          replay=replay_trace(raw.parent/row['trace_path'], row['stdout'])
          validate_run_summary(replay,row['summary'])
          # Shared CI runners are integration tests, not the benchmark machine.
          PY

  wasm-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Select stable Rust and WASM target
        run: |
          rustup default stable
          rustup target add wasm32-unknown-unknown
      - name: Build bounded WASM binary
        run: python3 tools/build_wasm.py
      - name: Install browser test dependencies
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Check worker execution and native agreement
        run: node web/tests/browser.mjs --report "$RUNNER_TEMP/wasm-browser.json"
      - name: Check input and recording validation
        run: node --test web/tests/data.test.mjs web/tests/timeline.test.mjs
      - name: Check early search capture
        run: node web/tests/early-worker.mjs
      - name: Check interactive site
        run: node web/tests/site.mjs --stress-seconds 3 --report "$RUNNER_TEMP/site-browser.json" --screenshots "$RUNNER_TEMP/site-screenshots"
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: wasm-browser-report
          path: |
            ${{ runner.temp }}/wasm-browser.json
            ${{ runner.temp }}/site-browser.json
            ${{ runner.temp }}/site-screenshots/
